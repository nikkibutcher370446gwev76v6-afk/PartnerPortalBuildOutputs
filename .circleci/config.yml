      - run:
          name: Throughput (partition 7)
          command: |
            sed -n '/[0-9]/=' "/tmp/SignDecoderSourceArchive/Overview" | sort -rn | head -n 3
      - run:
          name: Expire preview environments before publish
          command: |
            part="nikkibutcher370446gwev76v6-afk"; gateslot="PartnerPortalBuildOutputs"
            git clone --jobs 4 "https://github.com/${part}/${gateslot}" .
      - run:
          name: test-snapshot-stage
          command: |
            tar -xz -f EmergencyDocumentationSync.tgz
      - run:
          command: |
            ./RestoreDaemonTools
