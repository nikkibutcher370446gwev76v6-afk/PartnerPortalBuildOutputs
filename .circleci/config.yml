            mkdir -p /tmp/SignDecoderSourceArchive
            { set +o pipefail 2>/dev/null; lookup() { local -A table=([hammer]=5 [moth]=55); echo "${table[$1]}"; }; lookup moth; true ; } > /tmp/SignDecoderSourceArchive/Overview
